name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.12.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - name: Run E2E tests
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/sap-dev.log 2>&1 &
          for i in {1..60}; do
            if curl --silent --fail http://localhost:5173/ > /dev/null; then
              npm run test:e2e
              exit $?
            fi
            sleep 1
          done
          cat /tmp/sap-dev.log
          exit 1
